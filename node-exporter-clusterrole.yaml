---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-exporter-cluster-role
  labels:
    app.kubernetes.io/name: node-exporter-cluster-role
    app.kubernetes.io/component: exporter
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-exporter-cluster-rolebinding
  labels:
    app.kubernetes.io/name: node-exporter-cluster-rolebinding
    app.kubernetes.io/component: exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-exporter-cluster-role
subjects:
  - kind: ServiceAccount
    name: node-exporter-sa
    namespace: node-exporter-ns

apiVersion: v1
kind: Service
metadata:
  name: tomcat-service
  namespace: logging
  labels:
    app: tomcat
spec:
  type: NodePort
  selector:
    app: tomcat
  ports:
    - name: http
      protocol: TCP
      port: 8080        # The port exposed internally inside the cluster
      targetPort: 8080  # The container port defined in your tomcat pod spec

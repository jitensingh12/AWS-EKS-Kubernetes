apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-state-metric-role
  namespace: logging
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: ["list", "watch"]
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - mutatingadmissionpolicybindings
    verbs:
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-state-metric-rolebinding
  namespace: logging
subjects:
  - kind: ServiceAccount
    name: kube-state-metric-sa
    namespace: logging
roleRef:
  kind: Role
  name: kube-state-metric-role
  apiGroup: rbac.authorization.k8s.io

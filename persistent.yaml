apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-logs-pv
spec:
  capacity:
    storage: 50Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-0aed52ddcb9ae0e05
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-tomcat-pvc
  namespace: logging
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 50Gi

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metric-role
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metric-rolebinding
  namespace: logging
subjects:
  - kind: ServiceAccount
    name: kube-state-metric-sa
    namespace: logging
roleRef:
  kind: ClusterRole
  name: kube-state-metric-role
  apiGroup: rbac.authorization.k8s.io
